[package]
name = "eh3d-isocam"
version = "0.0.1"
edition = "2021"
rust-version = "1.82"
description = "Isolation milling of copper from a Gerber layer: exact offsets of the copper, several passes, checks for gaps the tool cannot cut, and G-code"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-ISOCAM"
readme = "README.md"

[lib]
name = "eh3d_isocam"
path = "src/lib.rs"

[[bin]]
name = "eh3d-isocam"
path = "src/main.rs"

[dependencies]
# the readers and the shapes of the suite (path dependencies on the sibling repositories)
eh3d-parser-gerber = { path = "../EH3D-CORE-LIBS/crates/eh3d-parser-gerber" }
eh3d-gerberviewer = { path = "../EH3D-GERBERVIEWER" }

[profile.release]
opt-level = 3
lto = true
