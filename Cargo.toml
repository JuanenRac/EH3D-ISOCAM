[package]
name = "eh3d-isocam"
version = "0.0.8"
edition = "2021"
rust-version = "1.88"
description = "Isolation milling of copper from a Gerber layer: exact offsets of the copper, several passes, checks for gaps the tool cannot cut, and G-code"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-ISOCAM"
readme = "README.md"

[lib]
name = "eh3d_isocam"
path = "src/lib.rs"

[[bin]]
name = "eh3d-isocam"
path = "src/main.rs"

[features]
default = []
# the window (egui, with the icon of the program): `cargo run --release --features gui`
gui = ["dep:eframe", "dep:png"]

[dependencies]
# the readers and the shapes of the suite (path dependencies on the sibling repositories)
eh3d-parser-gerber = { version = ">=0.0.2", path = "../EH3D-CORE-LIBS/crates/eh3d-parser-gerber" }
# raster geometry: units of length, distance transform, contour lines
eh3d-raster = { version = ">=0.0.3", path = "../EH3D-CORE-LIBS/crates/eh3d-raster" }
# the pure CAM: the copper on a grid, isolation passes, checks, path order, fiducials, board transforms and old-style Gerber
eh3d-cam = { version = ">=0.0.3", path = "../EH3D-CORE-LIBS/crates/eh3d-cam" }
eh3d-gerberviewer ={ version = ">=0.0.1", path = "../EH3D-GERBERVIEWER" }
eh3d-parser-gcode = { version = ">=0.0.7", path = "../EH3D-CORE-LIBS/crates/eh3d-parser-gcode" }
eh3d-parser-excellon = { version = ">=0.0.7", path = "../EH3D-CORE-LIBS/crates/eh3d-parser-excellon" }
# the Bungard file formats: Excellon (mils), plotter files, board outlines (Gerber and DXF)
eh3d-bungard-formats = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/formats" }

# the window
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"], optional = true }
png = { version = "0.17", optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"], optional = true }

[profile.release]
opt-level = 3
lto = true

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
