# EH3D-ISOCAM settings
res_mm = 0.02
fine_tool_mm = 0.2
fine_passes = 1
fine_stepover_mm = 0.1
coarse_tool_mm = 0
coarse_passes = 1
coarse_stepover_mm = 0.3
trim_fine = yes
rubout_tool_mm = 0
rubout_width_mm = 1
rubout_overlap = 0.2
around_pads_min_mm = 0
depth_mm = 0.06
feed_mm_min = 300
plunge_mm_min = 60
safe_z_mm = 2
tool_change_z_mm = 30
spindle_rpm = 24000
direction = climb
start_x_mm = 0
start_y_mm = 0
loop_start = nearest
ordering = optimized
optimize_max_paths = 300
route_tool_mm = 1
alignment_hole_mm = 3
alignment_margin_mm = 5
alignment_holes = 3
alignment_tool = 90
mirror = none
rotate_quarters = 0
panel_cols = 1
panel_rows = 1
panel_gap_mm = 2
rule_min_width_mm = 0.2
rule_min_clearance_mm = 0.2
rule_annular_ring_mm = 0.15
rule_holes_on_copper = no
input_units = mm
output_units = mm
report_units = mm
forced_isolation = no
forced_min_gap_mm = 0.1
optimize_tolerance_mm = 0.01
spike_max_mm = 0.02
spike_angle_deg = 170
scale_x = 1
scale_y = 1
fiducial_model = auto
fiducial_max_scale_deviation = 0.05
fiducial_max_residual_mm = 0.2
mask_margin_mm = 0.05
preview_cols = 100
# reference points, relative to the centre of the board, two or more: fiducial = design_x, design_y, measured_x, measured_y
# fiducial = 0, 0, 0.1, 0.05
# fiducial = 100, 0, 100.2, 0.05
# old-style Gerber layers (no format statement; the list of apertures is given with --apertures): digits before and after the point, the zeros left out, the units
# when the file says nothing, and how the list is read (its unit, and which number after the D code is the size)
gerber_format = 2.3
gerber_zeros = leading
gerber_units = inch
aperture_units = mil
aperture_size_column = 1
# accept the gaps that are narrower than the tool by up to this much (the tool scrapes the copper a little there); 0 accepts none
conflict_tolerance_mm = 0
# problem zones that check reports as warnings: inner corners sharper than this angle (0 = do not look for them), and a track with a pad on each side nearer than this
# multiple of the tool (0 = do not look for them)
problem_corner_angle_deg = 60
problem_track_gap_factor = 1.5
# bridges that hold the board in the sheet when it is cut out (route): how many on each closed path (0 puts none), the material left, the shortest piece between two
tab_count = 0
tab_width_mm = 1
tab_min_length_mm = 4
# alignment holes: normal (outside the board) or special (about its middle, a pair set apart and, for six, four more set across); 2, 3 or 6 holes
alignment_pattern = normal
alignment_special_a_mm = 40
alignment_special_b_mm = 60
# a track or rectangular pad thinner than twice the tolerance plus this is reported when conflict_tolerance_mm is above 0
tolerance_warning_margin_mm = 0.05
# the tool that isolates one net chosen by a point (isolate --net X,Y), and the tool and direction of the lines that clear an area (rubout-area)
net_tool_mm = 1
rubout_lines_tool_mm = 0.8
rubout_lines_direction = horizontal
# where the conflict tolerance applies: all (every gap) or pads (only a gap with a pad beside it)
conflict_tolerance_scope = all
# filling closed paths with lines (rubout-area --contour): how far beyond the radius of the tool the lines stay from the edge of the copper when they are cut to a layer
rubout_fill_margin_mm = 0
# a plot of the holes (drills IN OUT.plt): the pen of each drill tool as tool:pen pairs (the tools left out take the lowest free pens), e.g. hpgl_pen_map = 1:2, 3:1
hpgl_pen_map =
# pen speed in cm/s written into a plot (VS); 0 leaves it to the machine
hpgl_pen_speed_cm_s = 0
# yes (usual): move a plot so that no coordinate is negative; no: keep the coordinates of the board, negative ones included, so that a plot and a drill file share one origin
hpgl_shift_negative = yes
# isolate with --outline FILE: put the cut round the outline first in the plot (the tool of route_tool_mm), on this pen (0 = the pen after the others); the isolation on its own pen (0 = as usual)
plot_outline = no
hpgl_outline_pen = 0
hpgl_isolation_pen = 0
# a drill file as the Bungard programs write it (M48 and %, tools by number, a repeated coordinate left out, CR LF, M00), and the digits of a coordinate, filled with zeros in front (0 = as they are)
ncd_isocam_style = no
ncd_digits = 0
