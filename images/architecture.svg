<title id="t">EH3D-ISOCAM architecture</title>
<desc id="d">EH3D-ISOCAM is a Rust library and command line that read a Gerber layer, draw its copper on a fine grid, trace the paths of an isolation milling tool at the exact distance and write them as G-code. It has no window yet.</desc>
